services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TEST_DB_NAME: ${TEST_DB_NAME}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./api
    # npm install ก่อน start ทุกครั้ง กัน node_modules ใน named volume ไม่ตรงกับ
    # package.json ปัจจุบัน (เช่นหลัง docker compose down -v ที่ลบ volume ทิ้ง
    # แล้ว image เก่ายังไม่เคย rebuild หลังเพิ่ม dependency ใหม่)
    # migration:run ก่อน start เช่นกัน กัน "relation does not exist" หลัง down -v
    # ลบ db_data ทิ้งด้วย — migration:run เป็น idempotent (เช็คตาราง migrations
    # ก่อนเสมอ) จึงรันซ้ำทุกครั้งที่ container start ได้โดยไม่มีผลเสีย
    command: sh -c "npm install && npm run migration:run && npm run start:dev"
    environment:
      NODE_ENV: development
      TZ: UTC
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - ./example_data:/app/example_data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${WEB_PORT}"
    environment:
      API_PROXY_TARGET: http://api:${API_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
